<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прокат великов — учёт</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e3e6eb;--ac:#1f7a5c;--acx:#fff;--rd:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2125;--tx:#eceff2;--mu:#98a2b3;--bd:#2d333a;--ac:#3fb68b;--acx:#0b1f17;--rd:#ef7b6e}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2125;--tx:#eceff2;--mu:#98a2b3;--bd:#2d333a;--ac:#3fb68b;--acx:#0b1f17;--rd:#ef7b6e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tab{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;white-space:nowrap}
.tab.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:14px;color:var(--tx)}.chk input{width:auto}
button.b{background:var(--ac);color:var(--acx);border:0;padding:10px 16px;border-radius:8px;font:inherit;cursor:pointer;margin-top:10px}
button.x{background:none;border:0;color:var(--rd);cursor:pointer;font:inherit}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}th{color:var(--mu);font-weight:500;font-size:12px}
.mu{color:var(--mu)}.in{color:var(--ac)}.out{color:var(--rd)}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.sum div{flex:1;min-width:130px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.sum b{display:block;font-size:20px}
.warn{font-size:13px;color:var(--mu);margin:0 0 12px}
</style>
</head>
<body>
<div class="wrap">
<h1>Прокат великов — учёт</h1>
<div id="status" class="warn">Загрузка…</div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</div>
<script>    
(function () {
"use strict";

// НАСТРОЙКИ SUPABASE
var URL_DB = 'https://yqjiklwvaqqkhsvhaxqg.supabase.co';
var KEY_DB = 'sb_publishable_Wc044t0uBww39WgLtiSGYd_aXFba_CP';

var clientDB = null;

var S = {
    models: [],
    clients: [],
    rentals: [],
    fin: []
};

var tab = "models";

var TABS = [
    ["models","Каталог"],
    ["clients","Клиенты"],
    ["rentals","Прокаты"],
    ["fin","Финансы"]
];

function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[c];
    });
}

function money(n) {
    return Number(n || 0).toLocaleString("ru-RU") + " ₽";
}

function today() {
    return new Date().toISOString().slice(0,10);
}

function $(id) {
    return document.getElementById(id);
}

function v(id) {
    var e = $(id);
    return e ? e.value.trim() : "";
}

// ЗАГРУЗКА SUPABASE БЕЗ БЕСКОНЕЧНОГО ЦИКЛА
function loadSupabaseLibrary() {
    return new Promise(function(resolve, reject) {

        if (window.supabase && window.supabase.createClient) {
            resolve();
            return;
        }

        var script = document.createElement("script");

        script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

        script.onload = function() {
            if (window.supabase && window.supabase.createClient) {
                resolve();
            } else {
                reject(new Error("Supabase не удалось инициализировать"));
            }
        };

        script.onerror = function() {
            reject(new Error("Не удалось загрузить библиотеку Supabase"));
        };

        document.head.appendChild(script);

        setTimeout(function() {
            if (!window.supabase || !window.supabase.createClient) {
                reject(new Error("Превышено время загрузки Supabase"));
            }
        }, 15000);

    });
}

// ЗАГРУЗКА ДАННЫХ
async function loadData() {
    try {

        $("status").textContent = "Загрузка актуальных данных...";

        var results = await Promise.all([
            clientDB.from("models").select("*").order("id", {ascending:false}),
            clientDB.from("clients").select("*").order("id", {ascending:false}),
            clientDB.from("rentals").select("*").order("id", {ascending:false}),
            clientDB.from("fin").select("*").order("id", {ascending:false})
        ]);

        results.forEach(function(result) {
            if (result.error) throw result.error;
        });

        S.models = results[0].data || [];
        S.clients = results[1].data || [];
        S.rentals = results[2].data || [];
        S.fin = results[3].data || [];

        $("status").textContent =
            "Данные синхронизированы с облаком. Все устройства видят изменения.";

        render();

    } catch(e) {

        console.error("Ошибка загрузки:", e);

        $("status").textContent =
            "Ошибка подключения к базе: " + e.message;

    }
}

// СИНХРОНИЗАЦИЯ
function subscribeRealtime() {
    clientDB.channel("schema-db-changes")
        .on(
            "postgres_changes",
            {event:"*", schema:"public"},
            function() {
                loadData();
            }
        )
        .subscribe();
}

// ИМЕНА
function name(list, id, f) {
    for (var i = 0; i < list.length; i++) {
        if (Number(list[i].id) === Number(id)) {
            return list[i][f];
        }
    }
    return "—";
}

// ВКЛАДКИ
function renderTabs() {
    var h = "";

    TABS.forEach(function(t) {
        h += '<button class="tab' +
            (tab === t[0] ? " on" : "") +
            '" data-t="' + t[0] + '">' + t[1] + '</button>';
    });

    $("tabs").innerHTML = h;

    Array.prototype.forEach.call(
        document.querySelectorAll(".tab"),
        function(b) {
            b.onclick = function() {
                tab = b.dataset.t;
                render();
            };
        }
    );
}

function render() {
    renderTabs();

    var f = {
        models:rModels,
        clients:rClients,
        rentals:rRentals,
        fin:rFin
    }[tab];

    $("view").innerHTML = f();
    bind();
}

// КАТАЛОГ
function rModels() {
    var h = '<div class="card"><div class="grid">' +
        '<div><label>Модель</label><input id="m_n"></div>' +
        '<div><label>Цена за час, ₽</label><input id="m_h" type="number"></div>' +
        '<div><label>Цена за день, ₽</label><input id="m_d" type="number"></div>' +
        '<div><label>Заметка</label><input id="m_t"></div>' +
        '</div><button class="b" id="m_add">Добавить модель</button></div>';

    h += '<div class="card scroll"><table>' +
        '<tr><th>Модель</th><th>За час</th><th>За день</th><th>Заметка</th><th></th></tr>';

    S.models.forEach(function(m) {
        h += '<tr><td>' + esc(m.name) +
            '</td><td>' + money(m.hour) +
            '</td><td>' + money(m.day) +
            '</td><td class="mu">' + esc(m.note) +
            '</td><td><button class="x" data-del="models:' + m.id + '">Удалить</button></td></tr>';
    });

    if (!S.models.length) {
        h += '<tr><td colspan="5" class="mu">Моделей пока нет</td></tr>';
    }

    return h + '</table></div>';
}

// КЛИЕНТЫ
function rClients() {
    var h = '<p class="warn">Паспортные данные — это персональные данные. Не давайте доступ к странице посторонним.</p>' +
        '<div class="card"><div class="grid">' +
        '<div><label>ФИО</label><input id="c_n"></div>' +
        '<div><label>Телефон</label><input id="c_p"></div>' +
        '<div><label>Паспорт</label><input id="c_d"></div>' +
        '</div><div class="chk"><input type="checkbox" id="c_pd"><span>Согласие на ОПД получено</span></div>' +
        '<button class="b" id="c_add">Добавить клиента</button></div>';

    h += '<div class="card scroll"><table>' +
        '<tr><th>ФИО</th><th>Телефон</th><th>Паспорт</th><th>Согласие ПД</th><th></th></tr>';

    S.clients.forEach(function(c) {
        h += '<tr><td>' + esc(c.name) +
            '</td><td>' + esc(c.phone) +
            '</td><td>' + esc(c.passport) +
            '</td><td>' + (c.pd ? "да" : "нет") +
            '</td><td><button class="x" data-del="clients:' + c.id + '">Удалить</button></td></tr>';
    });

    if (!S.clients.length) {
        h += '<tr><td colspan="5" class="mu">Клиентов пока нет</td></tr>';
    }

    return h + '</table></div>';
}

function opts(list, f) {
    return list.map(function(x) {
        return '<option value="' + esc(x.id) + '">' +
            esc(x[f]) + '</option>';
    }).join("");
}

// ПРОКАТЫ
function rRentals() {
    var h = '<div class="card"><div class="grid">' +
        '<div><label>Клиент</label><select id="r_c">' + opts(S.clients,"name") + '</select></div>' +
        '<div><label>Модель</label><select id="r_m">' + opts(S.models,"name") + '</select></div>' +
        '<div><label>Дата</label><input id="r_dt" type="date" value="' + today() + '"></div>' +
        '<div><label>Дней</label><input id="r_k" type="number" value="1"></div>' +
        '<div><label>Сумма, ₽</label><input id="r_a" type="number"></div>' +
        '</div><div class="chk"><input type="checkbox" id="r_i"><span>Страховка</span></div>' +
        '<div class="chk"><input type="checkbox" id="r_f" checked><span>В доходы</span></div>' +
        '<button class="b" id="r_add">Оформить прокат</button></div>';

    h += '<div class="card scroll"><table>' +
        '<tr><th>Дата</th><th>Клиент</th><th>Модель</th><th>Дней</th><th>Сумма</th><th>Страховка</th><th></th></tr>';

    S.rentals.forEach(function(r) {
        h += '<tr><td>' + esc(r.date) +
            '</td><td>' + esc(name(S.clients,r.client_id,"name")) +
            '</td><td>' + esc(name(S.models,r.model_id,"name")) +
            '</td><td>' + esc(r.days) +
            '</td><td>' + money(r.amount) +
            '</td><td>' + (r.insured ? "да" : "нет") +
            '</td><td><button class="x" data-del="rentals:' + r.id + '">Удалить</button></td></tr>';
    });

    if (!S.rentals.length) {
        h += '<tr><td colspan="7" class="mu">Прокатов пока нет</td></tr>';
    }

    return h + '</table></div>';
}

// ФИНАНСЫ
function rFin() {
    var inc = 0;
    var out = 0;

    S.fin.forEach(function(f) {
        if (f.type === "in") inc += Number(f.amount);
        else out += Number(f.amount);
    });

    var h = '<div class="sum">' +
        '<div><label>Доходы</label><b class="in">' + money(inc) + '</b></div>' +
        '<div><label>Расходы</label><b class="out">' + money(out) + '</b></div>' +
        '<div><label>Касса</label><b>' + money(inc-out) + '</b></div></div>';

    h += '<div class="card"><div class="grid">' +
        '<div><label>Тип</label><select id="f_t"><option value="in">Доход</option><option value="out">Расход</option></select></div>' +
        '<div><label>Сумма, ₽</label><input id="f_a" type="number"></div>' +
        '<div><label>Статья / Комментарий</label><input id="f_m"></div>' +
        '<div><label>Дата</label><input id="f_d" type="date" value="' + today() + '"></div>' +
        '</div><button class="b" id="f_add">Добавить операцию</button></div>';

    h += '<div class="card scroll"><table>' +
        '<tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Описание</th><th></th></tr>';

    S.fin.forEach(function(f) {
        h += '<tr><td>' + esc(f.date) +
            '</td><td class="' + f.type + '">' + (f.type === "in" ? "Доход" : "Расход") +
            '</td><td>' + money(f.amount) +
            '</td><td class="mu">' + esc(f.note) +
            '</td><td><button class="x" data-del="fin:' + f.id + '">Удалить</button></td></tr>';
    });

    if (!S.fin.length) {
        h += '<tr><td colspan="5" class="mu">Операций пока нет</td></tr>';
    }

    return h + '</table></div>';
}

// ОБРАБОТЧИКИ
async function bind() {

    if ($("m_add")) $("m_add").onclick = async function() {
        var n = v("m_n"), h = v("m_h"), d = v("m_d"), t = v("m_t");
        if (!n) return;

        var res = await clientDB.from("models").insert([
            {name:n, hour:h, day:d, note:t}
        ]);

        if (res.error) return alert(res.error.message);
        loadData();
    };

    if ($("c_add")) $("c_add").onclick = async function() {
        var n = v("c_n"), p = v("c_p"), d = v("c_d"), pd = $("c_pd").checked;
        if (!n) return;

        var res = await clientDB.from("clients").insert([
            {name:n, phone:p, passport:d, pd:pd}
        ]);

        if (res.error) return alert(res.error.message);
        loadData();
    };

    if ($("r_add")) $("r_add").onclick = async function() {
        var c = v("r_c"), m = v("r_m"), dt = v("r_dt"),
            k = v("r_k"), a = v("r_a"),
            ins = $("r_i").checked, f = $("r_f").checked;

        if (!c || !m) return;

        var res = await clientDB.from("rentals").insert([{
            client_id:c,
            model_id:m,
            date:dt,
            days:k,
            amount:a,
            insured:ins
        }]);

        if (res.error) return alert(res.error.message);

        if (f) {
            var finRes = await clientDB.from("fin").insert([{
                type:"in",
                amount:a,
                note:"Прокат: " + name(S.models,m,"name") +
                    " (" + name(S.clients,c,"name") + ")",
                date:dt
            }]);

            if (finRes.error) return alert(finRes.error.message);
        }

        loadData();
    };

    if ($("f_add")) $("f_add").onclick = async function() {
        var t = v("f_t"), a = v("f_a"), m = v("f_m"), d = v("f_d");
        if (!a) return;

        var res = await clientDB.from("fin").insert([{
            type:t,
            amount:a,
            note:m,
            date:d
        }]);

        if (res.error) return alert(res.error.message);
        loadData();
    };

    // ИСПРАВЛЕННОЕ УДАЛЕНИЕ
    Array.prototype.forEach.call(
        document.querySelectorAll("[data-del]"),
        function(b) {
            b.onclick = async function() {
                if (!confirm("Удалить запись безвозвратно?")) return;

                var p = b.dataset.del.split(":");

                var res = await clientDB
                    .from(p[0])
                    .delete()
                    .eq("id", Number(p[1]));

                if (res.error) return alert(res.error.message);

                loadData();
            };
        }
    );
}

// ЗАПУСК ПРИЛОЖЕНИЯ
async function init() {
    try {

        $("status").textContent = "Подключение к базе...";

        if (URL_DB.indexOf("YOUR_PROJECT_ID") !== -1) {
            throw new Error("Укажи настоящий Project URL Supabase в URL_DB");
        }

        await loadSupabaseLibrary();

        clientDB = window.supabase.createClient(URL_DB, KEY_DB);

        await loadData();

        subscribeRealtime();

    } catch(e) {

        console.error("Ошибка запуска:", e);

        $("status").textContent = "Ошибка запуска: " + e.message;

    }
}

if (
    document.readyState === "complete" ||
    document.readyState === "interactive"
) {
    init();
} else {
    document.addEventListener("DOMContentLoaded", init, {once:true});
}

})();
</script>    
</body>
</html>
