<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прокат великов — учёт</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e3e6eb;--ac:#1f7a5c;--acx:#fff;--rd:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2125;--tx:#eceff2;--mu:#98a2b3;--bd:#2d333a;--ac:#3fb68b;--acx:#0b1f17;--rd:#ef7b6e}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2125;--tx:#eceff2;--mu:#98a2b3;--bd:#2d333a;--ac:#3fb68b;--acx:#0b1f17;--rd:#ef7b6e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tab{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;white-space:nowrap}
.tab.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:14px;color:var(--tx)}.chk input{width:auto}
button.b{background:var(--ac);color:var(--acx);border:0;padding:10px 16px;border-radius:8px;font:inherit;cursor:pointer;margin-top:10px}
button.x{background:none;border:0;color:var(--rd);cursor:pointer;font:inherit}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}th{color:var(--mu);font-weight:500;font-size:12px}
.mu{color:var(--mu)}.in{color:var(--ac)}.out{color:var(--rd)}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.sum div{flex:1;min-width:130px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.sum b{display:block;font-size:20px}
.warn{font-size:13px;color:var(--mu);margin:0 0 12px}
</style>
</head>
<body>
<div class="wrap">
<h1>Прокат великов — учёт</h1>
<div id="status" class="warn">Загрузка…</div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</div>
<script>    
(function () {
  "use strict";

  // НАСТРОЙКИ SUPABASE
  var URL_DB = "https://yqjiklwvaqqkhsvhaxqg.supabase.co";
  var KEY_DB = "sb_publishable_WcO44t0u8ww39WgltISGyQ_aXFba_CP";

  var clientDB = null;
  var realtimeChannel = null;
  var isLoading = false;

  var S = { models: [], clients: [], rentals: [], fin: [] };
  var tab = "models";

  var TABS = [
    ["models", "Каталог"],
    ["clients", "Клиенты"],
    ["rentals", "Прокаты"],
    ["fin", "Финансы"]
  ];

  function $(id) {
    return document.getElementById(id);
  }

  function setStatus(message) {
    var el = $("status");
    if (el) el.textContent = message;
  }

  function value(id) {
    var el = $(id);
    return el ? String(el.value || "").trim() : "";
  }

  function esc(input) {
    return String(input == null ? "" : input).replace(/[&<>"']/g, function (ch) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch];
    });
  }

  function money(amount) {
    var n = Number(amount);
    return (Number.isFinite(n) ? n : 0).toLocaleString("ru-RU") + " ₽";
  }

  function today() {
    var d = new Date();
    var month = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + month + "-" + day;
  }

  function numberOrNull(raw, label) {
    if (raw === "") return null;

    var n = Number(raw);

    if (!Number.isFinite(n)) {
      throw new Error("Проверь поле «" + label + "».");
    }

    return n;
  }

  function requiredNumber(raw, label, minimum) {
    if (raw === "") {
      throw new Error("Заполни поле «" + label + "».");
    }

    var n = Number(raw);

    if (!Number.isFinite(n) || n < minimum) {
      throw new Error(
        "В поле «" + label + "» должно быть число не меньше " + minimum + "."
      );
    }

    return n;
  }

  function showDbError(action, error) {
    console.error(action, error);

    var message = error && error.message
      ? error.message
      : String(error || "Неизвестная ошибка");

    alert(action + ": " + message);
    setStatus("Ошибка: " + message);
  }

  // ПОДКЛЮЧЕНИЕ SUPABASE
  function loadSupabaseLibrary() {
    return new Promise(function (resolve, reject) {

      if (
        window.supabase &&
        typeof window.supabase.createClient === "function"
      ) {
        resolve();
        return;
      }

      var existing = document.querySelector(
        'script[data-supabase-client="true"]'
      );

      var script = existing || document.createElement("script");
      var finished = false;

      var timer = setTimeout(function () {
        finish(
          new Error(
            "Не удалось загрузить библиотеку Supabase за 15 секунд. Проверь интернет или CDN."
          )
        );
      }, 15000);

      function finish(error) {
        if (finished) return;

        finished = true;
        clearTimeout(timer);

        if (error) {
          reject(error);
        } else if (
          window.supabase &&
          typeof window.supabase.createClient === "function"
        ) {
          resolve();
        } else {
          reject(
            new Error("Библиотека загрузилась, но window.supabase не найден.")
          );
        }
      }

      script.onload = function () {
        finish(null);
      };

      script.onerror = function () {
        finish(
          new Error(
            "CDN Supabase недоступен. Проверь подключение к интернету."
          )
        );
      };

      if (!existing) {
        script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
        script.async = true;
        script.setAttribute("data-supabase-client", "true");
        document.head.appendChild(script);
      }
    });
  }

  // ЗАГРУЗКА ДАННЫХ
  async function loadData() {

    if (!clientDB || isLoading) return false;

    isLoading = true;
    setStatus("Загружаю данные из базы...");

    try {

      var results = await Promise.all([
        clientDB.from("models").select("*").order("id", { ascending: false }),
        clientDB.from("clients").select("*").order("id", { ascending: false }),
        clientDB.from("rentals").select("*").order("id", { ascending: false }),
        clientDB.from("fin").select("*").order("id", { ascending: false })
      ]);

      var tableNames = ["models", "clients", "rentals", "fin"];

      for (var i = 0; i < results.length; i++) {
        if (results[i].error) {
          throw new Error(
            "Таблица " + tableNames[i] + ": " + results[i].error.message
          );
        }
      }

      S.models = results[0].data || [];
      S.clients = results[1].data || [];
      S.rentals = results[2].data || [];
      S.fin = results[3].data || [];

      render();

      setStatus("Данные загружены и синхронизированы с Supabase.");

      return true;

    } catch (error) {

      console.error("Ошибка загрузки данных:", error);

      setStatus("Ошибка загрузки: " + (error.message || error));

      return false;

    } finally {

      isLoading = false;

    }
  }

  // REALTIME
  function subscribeRealtime() {

    if (!clientDB || realtimeChannel) return;

    try {

      realtimeChannel = clientDB
        .channel("schema-db-changes")
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public"
          },
          function () {
            loadData();
          }
        )
        .subscribe(function (status) {

          if (status === "CHANNEL_ERROR") {
            console.error(
              "Supabase Realtime: ошибка подписки на изменения."
            );
          }

        });

    } catch (error) {

      console.error("Не удалось включить Realtime:", error);

    }
  }

  // ПОИСК ИМЕНИ
  function findName(list, id, field) {

    for (var i = 0; i < list.length; i++) {

      if (Number(list[i].id) === Number(id)) {
        return list[i][field];
      }

    }

    return "—";
  }

  // ВКЛАДКИ
  function renderTabs() {

    var html = "";

    TABS.forEach(function (item) {

      html +=
        '<button class="tab' +
        (tab === item[0] ? " on" : "") +
        '" data-t="' +
        item[0] +
        '">' +
        item[1] +
        "</button>";

    });

    $("tabs").innerHTML = html;

    Array.prototype.forEach.call(
      document.querySelectorAll(".tab"),
      function (button) {

        button.onclick = function () {
          tab = button.dataset.t;
          render();
        };

      }
    );
  }

  // ОБНОВЛЕНИЕ ИНТЕРФЕЙСА
  function render() {

    renderTabs();

    var views = {
      models: renderModels,
      clients: renderClients,
      rentals: renderRentals,
      fin: renderFinance
    };

    $("view").innerHTML = views[tab]();

    bind();
  }

  // КАТАЛОГ МОДЕЛЕЙ
  function renderModels() {

    var html =
      '<div class="card"><div class="grid">' +
      '<div><label>Модель</label><input id="m_n"></div>' +
      '<div><label>Цена за час, ₽</label><input id="m_h" type="number" min="0" step="0.01"></div>' +
      '<div><label>Цена за день, ₽</label><input id="m_d" type="number" min="0" step="0.01"></div>' +
      '<div><label>Заметка</label><input id="m_t"></div>' +
      '</div><button class="b" id="m_add">Добавить модель</button></div>';

    html +=
      '<div class="card scroll"><table>' +
      '<tr><th>Модель</th><th>За час</th><th>За день</th><th>Заметка</th><th></th></tr>';

    S.models.forEach(function (model) {

      html +=
        "<tr><td>" + esc(model.name) +
        "</td><td>" + money(model.hour) +
        "</td><td>" + money(model.day) +
        '</td><td class="mu">' + esc(model.note) +
        '</td><td><button class="x" data-del="models:' +
        model.id + '">Удалить</button></td></tr>';

    });

    if (!S.models.length) {
      html += '<tr><td colspan="5" class="mu">Моделей пока нет</td></tr>';
    }

    return html + "</table></div>";
  }

  // КЛИЕНТЫ
  function renderClients() {

    var html =
      '<p class="warn">Паспортные данные — персональные данные. Не предоставляйте посторонним доступ к странице.</p>' +
      '<div class="card"><div class="grid">' +
      '<div><label>ФИО</label><input id="c_n"></div>' +
      '<div><label>Телефон</label><input id="c_p"></div>' +
      '<div><label>Паспорт</label><input id="c_d"></div>' +
      '</div><div class="chk"><input type="checkbox" id="c_pd"><span>Согласие на обработку персональных данных получено</span></div>' +
      '<button class="b" id="c_add">Добавить клиента</button></div>';

    html +=
      '<div class="card scroll"><table>' +
      '<tr><th>ФИО</th><th>Телефон</th><th>Паспорт</th><th>Согласие ПД</th><th></th></tr>';

    S.clients.forEach(function (client) {

      html +=
        "<tr><td>" + esc(client.name) +
        "</td><td>" + esc(client.phone) +
        "</td><td>" + esc(client.passport) +
        "</td><td>" + (client.pd ? "да" : "нет") +
        '</td><td><button class="x" data-del="clients:' +
        client.id + '">Удалить</button></td></tr>';

    });

    if (!S.clients.length) {
      html += '<tr><td colspan="5" class="mu">Клиентов пока нет</td></tr>';
    }

    return html + "</table></div>";
  }

  // СПИСОК ВЫБОРА
  function options(list, field) {

    if (!list.length) {
      return '<option value="">Нет записей</option>';
    }

    return list.map(function (item) {

      return '<option value="' +
        esc(item.id) +
        '">' +
        esc(item[field]) +
        "</option>";

    }).join("");
  }

  // ПРОКАТЫ
  function renderRentals() {

    var html =
      '<div class="card"><div class="grid">' +
      '<div><label>Клиент</label><select id="r_c">' +
      options(S.clients, "name") + "</select></div>" +
      '<div><label>Модель</label><select id="r_m">' +
      options(S.models, "name") + "</select></div>" +
      '<div><label>Дата</label><input id="r_dt" type="date" value="' +
      today() + '"></div>' +
      '<div><label>Дней</label><input id="r_k" type="number" min="1" step="1" value="1"></div>' +
      '<div><label>Сумма, ₽</label><input id="r_a" type="number" min="0" step="0.01"></div>' +
      '</div><div class="chk"><input type="checkbox" id="r_i"><span>Страховка</span></div>' +
      '<div class="chk"><input type="checkbox" id="r_f" checked><span>Добавить сумму в доходы</span></div>' +
      '<button class="b" id="r_add">Оформить прокат</button></div>';

    html +=
      '<div class="card scroll"><table>' +
      '<tr><th>Дата</th><th>Клиент</th><th>Модель</th><th>Дней</th><th>Сумма</th><th>Страховка</th><th></th></tr>';

    S.rentals.forEach(function (rental) {

      html +=
        "<tr><td>" + esc(rental.date) +
        "</td><td>" + esc(findName(S.clients, rental.client_id, "name")) +
        "</td><td>" + esc(findName(S.models, rental.model_id, "name")) +
        "</td><td>" + esc(rental.days) +
        "</td><td>" + money(rental.amount) +
        "</td><td>" + (rental.insured ? "да" : "нет") +
        '</td><td><button class="x" data-del="rentals:' +
        rental.id + '">Удалить</button></td></tr>';

    });

    if (!S.rentals.length) {
      html += '<tr><td colspan="7" class="mu">Прокатов пока нет</td></tr>';
    }

    return html + "</table></div>";
  }

  // ФИНАНСЫ
  function renderFinance() {

    var income = 0;
    var expenses = 0;

    S.fin.forEach(function (item) {

      if (item.type === "in") {
        income += Number(item.amount || 0);
      } else {
        expenses += Number(item.amount || 0);
      }

    });

    var html =
      '<div class="sum">' +
      '<div><label>Доходы</label><b class="in">' + money(income) + "</b></div>" +
      '<div><label>Расходы</label><b class="out">' + money(expenses) + "</b></div>" +
      '<div><label>Касса</label><b>' + money(income - expenses) + "</b></div></div>";

    html +=
      '<div class="card"><div class="grid">' +
      '<div><label>Тип</label><select id="f_t"><option value="in">Доход</option><option value="out">Расход</option></select></div>' +
      '<div><label>Сумма, ₽</label><input id="f_a" type="number" min="0" step="0.01"></div>' +
      '<div><label>Статья / комментарий</label><input id="f_m"></div>' +
      '<div><label>Дата</label><input id="f_d" type="date" value="' + today() + '"></div>' +
      '</div><button class="b" id="f_add">Добавить операцию</button></div>';

    html +=
      '<div class="card scroll"><table>' +
      '<tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Описание</th><th></th></tr>';

    S.fin.forEach(function (item) {

      html +=
        "<tr><td>" + esc(item.date) +
        '</td><td class="' + esc(item.type) + '">' +
        (item.type === "in" ? "Доход" : "Расход") +
        "</td><td>" + money(item.amount) +
        '</td><td class="mu">' + esc(item.note) +
        '</td><td><button class="x" data-del="fin:' +
        item.id + '">Удалить</button></td></tr>';

    });

    if (!S.fin.length) {
      html += '<tr><td colspan="5" class="mu">Операций пока нет</td></tr>';
    }

    return html + "</table></div>";
  }

  // СОСТОЯНИЕ КНОПОК
  function setButtonBusy(button, busy, text) {

    if (!button) return;

    button.disabled = busy;

    if (busy) {

      button.dataset.originalText = button.textContent;
      button.textContent = text || "Сохранение...";

    } else if (button.dataset.originalText) {

      button.textContent = button.dataset.originalText;
      delete button.dataset.originalText;

    }
  }

  // ДОБАВЛЕНИЕ И УДАЛЕНИЕ
  async function bind() {

    // ДОБАВИТЬ МОДЕЛЬ
    var addModel = $("m_add");

    if (addModel) {
      addModel.onclick = async function () {

        setButtonBusy(addModel, true);

        try {

          var modelName = value("m_n");

          if (!modelName) {
            throw new Error("Введи название модели.");
          }

          var hour = numberOrNull(value("m_h"), "Цена за час");
          var day = numberOrNull(value("m_d"), "Цена за день");

          if (hour !== null && hour < 0) {
            throw new Error("Цена за час не может быть отрицательной.");
          }

          if (day !== null && day < 0) {
            throw new Error("Цена за день не может быть отрицательной.");
          }

          var result = await clientDB
            .from("models")
            .insert([{
              name: modelName,
              hour: hour,
              day: day,
              note: value("m_t")
            }]);

          if (result.error) throw result.error;

          alert("Модель добавлена.");

          await loadData();

        } catch (error) {

          showDbError("Не удалось добавить модель", error);

        } finally {

          setButtonBusy(addModel, false);

        }
      };
    }

    // ДОБАВИТЬ КЛИЕНТА
    var addClient = $("c_add");

    if (addClient) {
      addClient.onclick = async function () {

        setButtonBusy(addClient, true);

        try {

          var clientName = value("c_n");

          if (!clientName) {
            throw new Error("Введи ФИО клиента.");
          }

          var result = await clientDB
            .from("clients")
            .insert([{
              name: clientName,
              phone: value("c_p") || null,
              passport: value("c_d") || null,
              pd: $("c_pd").checked
            }]);

          if (result.error) throw result.error;

          alert("Клиент добавлен.");

          await loadData();

        } catch (error) {

          showDbError("Не удалось добавить клиента", error);

        } finally {

          setButtonBusy(addClient, false);

        }
      };
    }

    // ОФОРМИТЬ ПРОКАТ
    var addRental = $("r_add");

    if (addRental) {
      addRental.onclick = async function () {

        setButtonBusy(addRental, true);

        try {

          var clientId = value("r_c");
          var modelId = value("r_m");
          var date = value("r_dt");

          if (!clientId || !modelId) {
            throw new Error("Сначала добавь клиента и модель.");
          }

          if (!date) {
            throw new Error("Укажи дату проката.");
          }

          var days = requiredNumber(value("r_k"), "Дней", 1);

          if (!Number.isInteger(days)) {
            throw new Error("Количество дней должно быть целым числом.");
          }

          var amount = requiredNumber(value("r_a"), "Сумма", 0);

          var insured = $("r_i").checked;
          var addToIncome = $("r_f").checked;

          var rentalResult = await clientDB
            .from("rentals")
            .insert([{
              client_id: Number(clientId),
              model_id: Number(modelId),
              date: date,
              days: days,
              amount: amount,
              insured: insured
            }]);

          if (rentalResult.error) throw rentalResult.error;

          if (addToIncome) {

            var financeResult = await clientDB
              .from("fin")
              .insert([{
                type: "in",
                amount: amount,
                note: "Прокат: " +
                  findName(S.models, modelId, "name") +
                  " (" +
                  findName(S.clients, clientId, "name") +
                  ")",
                date: date
              }]);

            if (financeResult.error) {

              throw new Error(
                "Прокат записан, но не удалось добавить доход в финансы: " +
                financeResult.error.message
              );

            }
          }

          alert("Прокат оформлен.");

          await loadData();

        } catch (error) {

          showDbError("Не удалось оформить прокат", error);

        } finally {

          setButtonBusy(addRental, false);

        }
      };
    }

    // ДОБАВИТЬ ФИНАНСОВУЮ ОПЕРАЦИЮ
    var addFinance = $("f_add");

    if (addFinance) {
      addFinance.onclick = async function () {

        setButtonBusy(addFinance, true);

        try {

          var amount = requiredNumber(value("f_a"), "Сумма", 0);
          var date = value("f_d");

          if (!date) {
            throw new Error("Укажи дату операции.");
          }

          var result = await clientDB
            .from("fin")
            .insert([{
              type: value("f_t"),
              amount: amount,
              note: value("f_m") || null,
              date: date
            }]);

          if (result.error) throw result.error;

          alert("Операция добавлена.");

          await loadData();

        } catch (error) {

          showDbError("Не удалось добавить операцию", error);

        } finally {

          setButtonBusy(addFinance, false);

        }
      };
    }

    // УДАЛЕНИЕ ЗАПИСЕЙ
    Array.prototype.forEach.call(
      document.querySelectorAll("[data-del]"),
      function (button) {

        button.onclick = async function () {

          if (!confirm("Удалить запись безвозвратно?")) {
            return;
          }

          var parts = String(button.dataset.del || "").split(":");

          var table = parts[0];
          var id = Number(parts[1]);

          var allowedTables = [
            "models",
            "clients",
            "rentals",
            "fin"
          ];

          if (
            allowedTables.indexOf(table) === -1 ||
            !Number.isInteger(id) ||
            id <= 0
          ) {
            alert("Некорректные данные для удаления.");
            return;
          }

          setButtonBusy(button, true, "Удаление...");

          try {

            var result = await clientDB
              .from(table)
              .delete()
              .eq("id", id);

            if (result.error) throw result.error;

            await loadData();

          } catch (error) {

            showDbError("Не удалось удалить запись", error);

          } finally {

            setButtonBusy(button, false);

          }
        };
      }
    );
  }

  // ЗАПУСК
  async function init() {

    try {

      setStatus("Подключаю Supabase...");

      if (!URL_DB || !KEY_DB) {
        throw new Error("Не указаны URL или Publishable key Supabase.");
      }

      await loadSupabaseLibrary();

      clientDB = window.supabase.createClient(URL_DB, KEY_DB);

      await loadData();

      subscribeRealtime();

    } catch (error) {

      console.error("Ошибка запуска приложения:", error);

      setStatus("Ошибка запуска: " + (error.message || error));

    }
  }

  // ЗАПУСК ПОСЛЕ ЗАГРУЗКИ СТРАНИЦЫ
  if (document.readyState === "loading") {

    document.addEventListener(
      "DOMContentLoaded",
      init,
      { once: true }
    );

  } else {

    init();

  }

})();
</script>    
</body>
</html>
