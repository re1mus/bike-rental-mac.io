<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прокат великов — учёт</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e3e6eb;--ac:#1f7a5c;--acx:#fff;--rd:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2125;--tx:#eceff2;--mu:#98a2b3;--bd:#2d333a;--ac:#3fb68b;--acx:#0b1f17;--rd:#ef7b6e}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2125;--tx:#eceff2;--mu:#98a2b3;--bd:#2d333a;--ac:#3fb68b;--acx:#0b1f17;--rd:#ef7b6e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tab{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;white-space:nowrap}
.tab.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:14px;color:var(--tx)}.chk input{width:auto}
button.b{background:var(--ac);color:var(--acx);border:0;padding:10px 16px;border-radius:8px;font:inherit;cursor:pointer;margin-top:10px}
button.x{background:none;border:0;color:var(--rd);cursor:pointer;font:inherit}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}th{color:var(--mu);font-weight:500;font-size:12px}
.mu{color:var(--mu)}.in{color:var(--ac)}.out{color:var(--rd)}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.sum div{flex:1;min-width:130px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.sum b{display:block;font-size:20px}
.warn{font-size:13px;color:var(--mu);margin:0 0 12px}
</style>
</head>
<body>
<div class="wrap">
<h1>Прокат великов — учёт</h1>
<div id="status" class="warn">Загрузка…</div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</div>
<script>
(function(){
var S={models:[],clients:[],rentals:[],fin:[]},tab="models",db=null;
var TABS=[["models","Каталог"],["clients","Клиенты"],["rentals","Прокаты"],["fin","Финансы"]];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return Number(n||0).toLocaleString("ru-RU")+" ₽"}
function today(){return new Date().toISOString().slice(0,10)}
function $(id){return document.getElementById(id)}
function v(id){var e=$(id);return e?e.value.trim():""}
var KEY="bikeRentalData_v1";
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){$("status").textContent="Не удалось сохранить в браузере. Сделайте резервную копию."}}
function col(n){return{add:function(d){var x=Object.assign({id:uid()},d);S[n].unshift(x);save();render();return Promise.resolve()},
 doc:function(id){return{delete:function(){S[n]=S[n].filter(function(r){return r.id!==id});save();render();return Promise.resolve()}}}}}
function exportData(){var b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="prokat-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove()}
function importData(f){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!confirm("Заменить текущие данные данными из файла?"))return;["models","clients","rentals","fin"].forEach(function(k){S[k]=Array.isArray(d[k])?d[k]:[]});save();render()}catch(e){alert("Файл не похож на резервную копию")}};r.readAsText(f)}
function name(list,id,f){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i][f];return "—"}
function renderTabs(){var h="";TABS.forEach(function(t){h+='<button class="tab'+(tab===t[0]?" on":"")+'" data-t="'+t[0]+'">'+t[1]+'</button>'});$("tabs").innerHTML=h;
 Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.onclick=function(){tab=b.dataset.t;render()}})}
function render(){renderTabs();var f={models:rModels,clients:rClients,rentals:rRentals,fin:rFin}[tab];$("view").innerHTML=f();bind()}
function rModels(){
 var h='<div class="card"><div class="grid"><div><label>Модель</label><input id="m_n"></div><div><label>Цена за час, ₽</label><input id="m_h" type="number"></div><div><label>Цена за день, ₽</label><input id="m_d" type="number"></div><div><label>Заметка</label><input id="m_t"></div></div><button class="b" id="m_add">Добавить модель</button></div>';
 h+='<div class="card scroll"><table><tr><th>Модель</th><th>За час</th><th>За день</th><th>Заметка</th><th></th></tr>';
 S.models.forEach(function(m){h+='<tr><td>'+esc(m.name)+'</td><td>'+money(m.hour)+'</td><td>'+money(m.day)+'</td><td class="mu">'+esc(m.note)+'</td><td><button class="x" data-del="models:'+m.id+'">Удалить</button></td></tr>'});
 if(!S.models.length)h+='<tr><td colspan="5" class="mu">Моделей пока нет</td></tr>';
 return h+'</table></div>'}
function rClients(){
 var h='<p class="warn">Паспортные данные — это персональные данные. Не давайте доступ к странице посторонним и получайте согласие клиента на их обработку.</p><div class="card"><div class="grid"><div><label>ФИО</label><input id="c_n"></div><div><label>Телефон</label><input id="c_p"></div><div><label>Паспорт (серия, номер, кем и когда выдан)</label><input id="c_d"></div></div><div class="chk"><input type="checkbox" id="c_pd"><span>Согласие на обработку персональных данных получено</span></div><button class="b" id="c_add">Добавить клиента</button></div>';
 h+='<div class="card scroll"><table><tr><th>ФИО</th><th>Телефон</th><th>Паспорт</th><th>Согласие ПД</th><th></th></tr>';
 S.clients.forEach(function(c){h+='<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone)+'</td><td>'+esc(c.passport)+'</td><td>'+(c.pd?"да":"нет")+'</td><td><button class="x" data-del="clients:'+c.id+'">Удалить</button></td></tr>'});
 if(!S.clients.length)h+='<tr><td colspan="5" class="mu">Клиентов пока нет</td></tr>';
 return h+'</table></div>'}
function opts(list,f){return list.map(function(x){return '<option value="'+esc(x.id)+'">'+esc(x[f])+'</option>'}).join("")}
function rRentals(){
 var h='<div class="card"><div class="grid"><div><label>Клиент</label><select id="r_c">'+opts(S.clients,"name")+'</select></div><div><label>Модель</label><select id="r_m">'+opts(S.models,"name")+'</select></div><div><label>Дата</label><input id="r_dt" type="date" value="'+today()+'"></div><div><label>Дней</label><input id="r_k" type="number" value="1"></div><div><label>Сумма, ₽</label><input id="r_a" type="number"></div></div><div class="chk"><input type="checkbox" id="r_i"><span>Клиент дал согласие на страховку</span></div><div class="chk"><input type="checkbox" id="r_f" checked><span>Записать сумму в доходы</span></div><button class="b" id="r_add">Оформить прокат</button></div>';
 h+='<div class="card scroll"><table><tr><th>Дата</th><th>Клиент</th><th>Модель</th><th>Дней</th><th>Сумма</th><th>Страховка</th><th></th></tr>';
 S.rentals.forEach(function(r){h+='<tr><td>'+esc(r.date)+'</td><td>'+esc(name(S.clients,r.clientId,"name"))+'</td><td>'+esc(name(S.models,r.modelId,"name"))+'</td><td>'+esc(r.days)+'</td><td>'+money(r.amount)+'</td><td>'+(r.insured?"согласие есть":"нет")+'</td><td><button class="x" data-del="rentals:'+r.id+'">Удалить</button></td></tr>'});
 if(!S.rentals.length)h+='<tr><td colspan="7" class="mu">Прокатов пока нет</td></tr>';
 return h+'</table></div>'}
function rFin(){
 var i=0,o=0;S.fin.forEach(function(x){if(x.type==="in")i+=+x.amount;else o+=+x.amount});
 var h='<div class="sum"><div><span class="mu">Доходы</span><b class="in">'+money(i)+'</b></div><div><span class="mu">Расходы</span><b class="out">'+money(o)+'</b></div><div><span class="mu">Итого</span><b>'+money(i-o)+'</b></div></div>';
 h+='<div class="card"><div class="grid"><div><label>Тип</label><select id="f_t"><option value="in">Доход</option><option value="out">Расход</option></select></div><div><label>Сумма, ₽</label><input id="f_a" type="number"></div><div><label>Категория / описание</label><input id="f_c" placeholder="например: ремонт, реклама"></div><div><label>Дата</label><input id="f_d" type="date" value="'+today()+'"></div></div><button class="b" id="f_add">Добавить запись</button></div>';
 h+='<div class="card scroll"><table><tr><th>Дата</th><th>Тип</th><th>Описание</th><th>Сумма</th><th></th></tr>';
 S.fin.forEach(function(x){h+='<tr><td>'+esc(x.date)+'</td><td class="'+(x.type==="in"?"in":"out")+'">'+(x.type==="in"?"Доход":"Расход")+'</td><td>'+esc(x.note)+'</td><td>'+money(x.amount)+'</td><td><button class="x" data-del="fin:'+x.id+'">Удалить</button></td></tr>'});
 if(!S.fin.length)h+='<tr><td colspan="5" class="mu">Записей пока нет</td></tr>';
 return h+'</table></div>'}
function on(id,fn){var e=$(id);if(e)e.onclick=fn}
function guard(p){p.catch(function(){$("status").textContent="Не удалось сохранить: у вас нет права записи. Попросите владельца выдать доступ «Редактор»."})}
function bind(){
 Array.prototype.forEach.call(document.querySelectorAll("[data-del]"),function(b){b.onclick=function(){if(!confirm("Удалить запись?"))return;var p=b.dataset.del.split(":");guard(col(p[0]).doc(p[1]).delete())}});
 on("m_add",function(){if(!v("m_n"))return;guard(col("models").add({name:v("m_n"),hour:+v("m_h")||0,day:+v("m_d")||0,note:v("m_t")}))});
 on("c_add",function(){if(!v("c_n"))return;guard(col("clients").add({name:v("c_n"),phone:v("c_p"),passport:v("c_d"),pd:$("c_pd").checked}))});
 on("r_add",function(){if(!v("r_c")||!v("r_m")){alert("Сначала добавьте клиента и модель");return}
  var a=+v("r_a")||0,d=v("r_dt")||today(),m=name(S.models,v("r_m"),"name"),c=name(S.clients,v("r_c"),"name");
  guard(col("rentals").add({clientId:v("r_c"),modelId:v("r_m"),date:d,days:+v("r_k")||1,amount:a,insured:$("r_i").checked}));
  if($("r_f").checked&&a>0)guard(col("fin").add({type:"in",amount:a,note:"Прокат: "+m+", "+c,date:d}))});
 on("f_add",function(){var a=+v("f_a");if(!a)return;guard(col("fin").add({type:v("f_t"),amount:a,note:v("f_c"),date:v("f_d")||today()}))});
}
try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);["models","clients","rentals","fin"].forEach(function(k){S[k]=Array.isArray(d[k])?d[k]:[]})}}catch(e){}
$("status").innerHTML='Данные хранятся в этом браузере на этом компьютере. <button class="x" id="ex" style="color:var(--ac)">Скачать резервную копию</button> · <button class="x" id="im" style="color:var(--ac)">Загрузить копию</button><input type="file" id="imf" accept=".json" style="display:none">';
$("ex").onclick=exportData;$("im").onclick=function(){$("imf").click()};$("imf").onchange=function(e){if(e.target.files[0])importData(e.target.files[0])};
render();
})();
</script>
</body>
</html>
